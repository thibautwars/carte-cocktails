<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c0a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="La carte des cocktails maison.">
  <title>La Carte</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0c0a'/%3E%3Cpath d='M14 16h36L32 36z' fill='none' stroke='%23d4af6a' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M32 36v14M22 50h20' stroke='%23d4af6a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Ordre important : d'abord les réglages, puis l'application, puis l'éditeur et le stock (mode hôte) -->
  <script src="config.js"></script>
  <script src="app.js" defer></script>
  <script src="editor.js" defer></script>
  <script src="stock.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <!-- ===== En-tête ===== -->
  <header class="site-header">
    <p class="overline" id="site-subtitle">Cocktails maison</p>
    <!-- Appui long de 2 secondes sur le titre = accès au mode hôte -->
    <h1 id="site-title" class="site-title">La Carte</h1>
    <div class="ornament" aria-hidden="true"><span></span><i>◆</i><span></span></div>
  </header>

  <!-- ===== Grille des cocktails ===== -->
  <main id="main" class="main">
    <div id="status" class="status" role="status">Chargement de la carte…</div>
    <!-- Avertissements (ingrédient inconnu, fichier manquant…) : visibles seulement en mode hôte -->
    <div id="host-warnings" class="warn-box" role="note" hidden></div>
    <ul id="grid" class="grid" aria-label="Cocktails"></ul>
  </main>

  <footer class="site-footer">
    <p>L'abus d'alcool est dangereux pour la santé. À consommer avec modération.</p>
  </footer>

  <!-- ===== Barre du mode hôte (cachée pour les invités) ===== -->
  <nav id="host-bar" class="host-bar" aria-label="Mode hôte" hidden>
    <span class="host-badge">Mode hôte</span>
    <button type="button" class="btn btn-small btn-gold" id="host-add">+ Ajouter</button>
    <button type="button" class="btn btn-small btn-ghost" id="host-stock">Stock</button>
    <button type="button" class="btn btn-small btn-ghost" id="host-github">GitHub</button>
    <button type="button" class="btn btn-small btn-ghost" id="host-exit">Quitter</button>
  </nav>

  <!-- ===== Fiche cocktail (panneau) ===== -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <button type="button" class="icon-btn sheet-close" id="sheet-close" aria-label="Fermer la fiche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="sheet-scroll" id="sheet-scroll">
        <div class="sheet-media" id="sheet-media"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>
  </dialog>

  <!-- ===== Saisie du code PIN ===== -->
  <dialog id="pin-dialog" class="modal modal-small" aria-labelledby="pin-title">
    <form id="pin-form" class="modal-inner" novalidate>
      <h2 id="pin-title" class="modal-title">Mode hôte</h2>
      <p class="modal-text">Entrez le code à 4 chiffres.</p>
      <input id="pin-input" class="pin-input" type="text" inputmode="numeric" pattern="[0-9]*"
             maxlength="4" autocomplete="off" aria-label="Code à 4 chiffres" aria-describedby="pin-error">
      <p id="pin-error" class="form-error" aria-live="assertive"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Annuler</button>
        <button type="submit" class="btn btn-gold">Valider</button>
      </div>
    </form>
  </dialog>

  <!-- ===== Réglage du token GitHub (rempli par editor.js) ===== -->
  <dialog id="token-dialog" class="modal" aria-labelledby="token-title"></dialog>

  <!-- ===== Formulaire d'ajout / modification (rempli par editor.js) ===== -->
  <dialog id="editor" class="modal modal-large" aria-labelledby="editor-title"></dialog>

  <!-- ===== Écran Stock (rempli par stock.js) ===== -->
  <dialog id="stock-dialog" class="modal modal-large" aria-labelledby="stock-title"></dialog>

  <!-- ===== Messages ===== -->
  <div id="toasts" class="toasts" aria-live="polite" popover="manual"></div>
</body>
</html>
